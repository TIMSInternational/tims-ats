packages:
  - "apps/*"
  - "packages/*"
  - "workers"
allowBuilds:
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": false
  "@swc/core": true
  # New in #124 via `tsx` (esbuild was not in the lockfile before). Set to FALSE deliberately, not left at
  # pnpm's placeholder: esbuild resolves its binary at runtime from the `@esbuild/<platform>` optional
  # package, so its postinstall is not required. Verified on BOTH platforms, not just reasoned about:
  #   darwin-arm64 — transpiled and ran a .ts file, and ran the failure-path tests, with this set to false.
  #   linux-x64    — CI run 31036129532 (`Security Audit`, ubuntu-latest) passed
  #                  tests/security/verify-tenant-grants-failure-paths.test.ts (5 tests), which spawns
  #                  node_modules/.bin/tsx and therefore exercises the esbuild binary on the runner.
  # Declining an unnecessary postinstall is the safer supply-chain default, and matches `@sentry/cli: false`.
  # If a runner ever cannot find the esbuild binary it surfaces as a loud test failure, never a silent
  # skip — flip this to true then, with a note saying why.
  esbuild: false
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Security patches scoped to affected dependency release lines.
overrides:
  "@opentelemetry/api": "1.9.1"
  "vite@>=8.0.0 <8.0.16": "8.0.16"
  "brace-expansion@>=1 <2": "1.1.18"
  "brace-expansion@>=2 <3": "2.1.4"
  "brace-expansion@>=5 <5.0.9": "5.0.9"
  "js-yaml@>=4 <4.3.2": "4.3.2"
  "fast-uri@>=3 <3.1.6": "3.1.6"
  "postcss@>=8 <8.5.18": "8.5.18"
  "nanoid@>=3 <3.3.18": "3.3.18"
  "browserslist@>=4 <4.28.7": "4.28.7"
  "@xmldom/xmldom@>=0.8 <0.8.15": "0.8.15"
  "next@15.5.24>sharp": "0.35.4"
  "ai@4.3.19>jsondiffpatch": "0.7.6"
