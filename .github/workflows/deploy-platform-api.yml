name: Deploy platform API

# THE ROOT-CAUSE FIX for the 2026-08-31 incident.
#
# The live App Runner service was found running an image built 2026-07-28 — 242 commits and 34 days
# behind `main`, with 45 undeployed commits touching services/Tims.Platform and seven completed slices
# that had never executed. Nothing was broken, because every merged endpoint is dark behind a
# default-false flag, and that is exactly why nobody noticed.
#
# The mechanical cause was small and total: `dotnet-platform.yml` runs `docker build` to VERIFY the
# image and then throws it away. Nothing ever pushed it, and nothing ever deployed it. Deploys were a
# manual ritual, so the gap opened in silence and stayed open until someone thought to compare a
# running image tag against main by hand.
#
# The real cost was not an outage. Three finished domains sat stuck at step 5 with no visible cause,
# and the FX stale-pin incident carried a recorded remedy — "run runbook A or B" — that was NOT
# EXECUTABLE for two weeks, because both code paths post-dated the running image.
#
# This workflow makes that state unreachable: every merge to main that touches the C# service builds,
# pushes and deploys it. `scripts/deploy/check-deploy-freshness.sh` (/gate check 21) remains the
# backstop — a control that lives only inside the thing it guards is not a control.

# ── GATED ON THE .NET TESTS (F16, 2026-09-29) ──────────────────────────────────────────────────────
# This workflow used to fire on `push` to main in PARALLEL with `.NET Platform CI`, so a merge whose
# C# tests failed was built, pushed and deployed anyway — the tests could only report the damage after
# production already ran it. It now runs on `workflow_run`: only AFTER `.NET Platform CI` completes,
# and the `decide` job refuses anything but a SUCCESSFUL, PUSH-triggered run on main of THIS repository
# (`branches: [main]` alone would also match a fork PR whose head branch happens to be named `main`).
# The deployed commit is `workflow_run.head_sha` — the exact commit the tests passed on — never "the
# tip of main at the time the deploy happened to start".
#
# Path semantics are preserved in two layers: `.NET Platform CI` is itself path-filtered (so this
# never fires for web-only merges), and because its filter is BROADER than the C# service
# (packages/db, scripts/**, ...), `decide` additionally diffs the tested commit against the RUNNING
# image's commit and skips when nothing under services/Tims.Platform (or this file) changed.
#
# `workflow_dispatch` remains the manual escape hatch (reason required, recorded in the job summary).
# Roll BACK with `rollback-platform-api.yml`, never by dispatching this against an old commit.
on:
  workflow_run:
    workflows: [".NET Platform CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you deploying by hand? (recorded in the job summary)"
        required: true
      force_older:
        description: "Deploy even though production runs a NEWER commit (a regression; logged in the summary). Prefer the rollback workflow."
        type: boolean
        required: false
        default: false

# ── CONCURRENCY: ONE LOCK FOR EVERY update-service (Codex round 2, 2026-09-29) ─────────────────────
# There is deliberately NO workflow-level `concurrency`. At workflow level every `workflow_run`
# completion entered the group — including failed/cancelled CI runs that `decide` then skips — and
# GitHub's default queue keeps ONE pending run per group, so an ineligible completion could replace (and
# cancel) a pending, valid deploy. `decide` is read-only and runs unlocked; its `if:` keeps ineligible
# events from ever reaching `deploy`, and a job skipped by its `if:` never enters a concurrency group.
#
# Only the MUTATING `deploy` job takes the lock, and rollback-platform-api.yml's `rollback` job takes
# the SAME one (`platform-api-mutation`). The two update-service paths are therefore serialized: a
# rollback can no longer complete between this job's preflight and its update-service — the race that
# per-workflow groups could not close, because App Runner's UpdateService has no expected-image
# precondition.
#
#   - `cancel-in-progress: false` — NEVER abort a rolling App Runner deployment partway; that leaves
#     the service in an operation state that blocks the next run.
#   - `queue: max` — a NON-replacing FIFO queue (up to 100 pending), so a pending rollback is never
#     displaced by a deploy that arrives after it, and a pending deploy is never displaced by a newer
#     one. (actionlint <= 1.7.12 predates this documented key and flags it; GitHub accepts it.)
#
# What the lock does NOT solve, and what covers it (scripts/deploy/apprunner-preflight.sh --deploy):
#   (a) FIFO order is by when each job started waiting, which GitHub does not guarantee matches commit
#       order, so an OLDER green commit can reach the lock after a newer one. The preflight resolves the
#       live tag: same-or-newer than this commit -> skip (exit 3); older -> deploy over it. Production
#       never regresses below what is live; /gate check 21 and the next merge catch any residue.
#   (b) A deploy decided BEFORE the pause can still be queued AHEAD of a rollback. The preflight refuses
#       if any rollback run was created at or after this deploy run, so it stands down and the rollback
#       runs next. (If the queue ever overflows 100, GitHub cancels the newest arrival — a rollback run
#       shown as cancelled must be re-dispatched.)
#   (c) A rollback dispatched while a deploy holds the lock WAITS and runs after it, so the rollback is
#       the last writer — the intended outcome. It may wait out the build (see the runbook).
#   (d) Out-of-band changes (console / CLI update-service) are not serialized by any group. The
#       preflight's live-image check narrows that window but cannot close it.
#   (e) RE-RUNNING an OLD rollback run is not detected. The created-after check dates a run by its
#       creation, not by its latest attempt, so a re-run of a rollback created BEFORE a waiting deploy
#       (one decided before the pause) is invisible to it once that re-run completes, and the deploy
#       could then roll forward over it. Mitigation is procedural (runbook 2.3): never re-run a
#       rollback run; always dispatch a NEW one, after setting the pause.
#
# ONE DECISION RULE for automatic and manual deploys (Codex round 4, 2026-09-29) — see `decide`:
# same commit -> skip; production runs a NEWER commit -> skip (automatic) or refuse unless
# `force_older: true` (manual; recorded in the job summary); production runs an OLDER or a DIVERGED
# commit -> deploy. Both paths only ever deploy a commit on main, so replacing a diverged image restores
# main rather than regressing it. Besides that NEWER case, the only asymmetry: the automatic path also skips when nothing under
# services/Tims.Platform changed; a manual dispatch deploys regardless. If the live image changes while
# a FORCED deploy waits, the preflight refuses instead of skipping, so the operator re-decides.
# The preflight also refuses when the live image moved WHILE WAITING to a diverged or unresolvable
# commit: pipeline deploys only install main commits and rollbacks are excluded, so that is an
# out-of-band change, and a human should look before it is overwritten. That is a change-while-waiting
# guard, not a second decision rule.
permissions:
  id-token: write # OIDC federation to AWS. No long-lived keys exist for this repo.
  contents: read
  actions: read # apprunner-preflight.sh lists rollback-platform-api.yml runs before update-service.

env:
  AWS_REGION: us-west-2 # NOT us-east-1 — that account holds unrelated NexaDev projects.
  SERVICE_NAME: tims-platform-api
  ECR_REPO: tims-platform-api

jobs:
  decide:
    name: Decide whether to deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level gate: a failed or cancelled test run, a pull_request-triggered run, or a run whose head
    # came from a fork never reaches a step that holds AWS credentials.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sha: ${{ steps.target.outputs.sha }}
      running_image: ${{ steps.decide.outputs.running_image }}

    steps:
      - name: Resolve the commit to deploy
        id: target
        env:
          EVENT: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$DISPATCH_REF" = "refs/heads/main" ] \
              || { echo "::error::Manual deploys run from main only (got $DISPATCH_REF)."; exit 1; }
            SHA="$DISPATCH_SHA"
          else
            SHA="$TESTED_SHA"
          fi
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Not a commit SHA: '$SHA'"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0 # the running image's commit must be resolvable for the diff below

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::747814092517:role/tims-ats-github-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Compare the tested commit with the running image
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ steps.target.outputs.sha }}
          REASON: ${{ inputs.reason }}
          FORCE_OLDER: ${{ inputs.force_older }}
          AUTODEPLOY_PAUSED: ${{ vars.PLATFORM_API_AUTODEPLOY_PAUSED }}
        run: |
          set -euo pipefail
          verdict() {
            echo "deploy=$1" >> "$GITHUB_OUTPUT"
            { echo "### Deploy decision: $1"; echo; echo "- commit: \`$SHA\`"; echo "- $2"; } >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=$1 — $2"
          }

          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::$SHA is not on main. Refusing to deploy it."; exit 1; }

          # Set FIRST by the rollback runbook (the rollback workflow refuses to start without it).
          # While it is set NO deploy runs, automatic or manual, so a green merge cannot put the bad
          # commit straight back. Unset it once the fix is on main.
          if [ "$AUTODEPLOY_PAUSED" = "true" ]; then
            echo "::warning::Deploys are paused (repo variable PLATFORM_API_AUTODEPLOY_PAUSED=true)."
            verdict false "deploys are PAUSED for a rollback — unset PLATFORM_API_AUTODEPLOY_PAUSED to resume"
            exit 0
          fi

          ARN="$(aws apprunner list-services --region "$AWS_REGION" \
                  --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" --output text)"
          test -n "$ARN" || { echo "::error::Service $SERVICE_NAME not found in $AWS_REGION"; exit 1; }
          RUNNING_IMAGE="$(aws apprunner describe-service --region "$AWS_REGION" --service-arn "$ARN" \
                  --query 'Service.SourceConfiguration.ImageRepository.ImageIdentifier' --output text)"
          RUNNING_TAG="${RUNNING_IMAGE##*:}"
          echo "running image: $RUNNING_IMAGE"
          # The deploy job re-checks, right before update-service, that this is STILL the live image.
          echo "running_image=$RUNNING_IMAGE" >> "$GITHUB_OUTPUT"

          RUNNING_SHA=""
          if echo "$RUNNING_TAG" | grep -Eq '^[0-9a-f]{7,40}$'; then
            RUNNING_SHA="$(git rev-parse --verify --quiet "${RUNNING_TAG}^{commit}" || true)"
          fi

          # ONE rule for both paths (automatic and manual), in this order:
          #   unattributable running tag -> deploy (restores attributability);
          #   same commit                -> skip;
          #   running is NEWER (this commit is its ancestor) -> automatic: skip; manual: refuse unless
          #                                 force_older=true (a rollback in disguise; recorded);
          #   running is OLDER or DIVERGED -> deploy. Both paths deploy a commit on main (checked above;
          #                                 a dispatch runs from main only), so deploying over a running
          #                                 commit that is not on main's line RESTORES main — it does not
          #                                 regress it. The warning names the replaced commit.
          # Besides the NEWER case, the only difference: the automatic path also skips when nothing under
          # services/Tims.Platform changed, because its trigger (.NET Platform CI) is path-filtered more broadly. A manual
          # dispatch is an explicit request to deploy, so it does not.
          if [ -z "$RUNNING_SHA" ]; then
            echo "::warning::Running tag '$RUNNING_TAG' does not resolve to a commit; deploying."
            verdict true "running tag \`$RUNNING_TAG\` is unattributable — deploying $SHA ($EVENT by $GITHUB_ACTOR)"
            exit 0
          fi
          if [ "$RUNNING_SHA" = "$SHA" ]; then
            verdict false "production already runs this commit ($EVENT by $GITHUB_ACTOR)"
            exit 0
          fi
          if git merge-base --is-ancestor "$SHA" "$RUNNING_SHA"; then
            if [ "$EVENT" != "workflow_dispatch" ]; then
              # Test runs can finish out of order. Deploying an older green commit after a newer one
              # would silently roll production BACK.
              verdict false "production runs \`$RUNNING_TAG\`, which is NEWER than the tested commit"
              exit 0
            fi
            if [ "$FORCE_OLDER" != "true" ]; then
              echo "::error::Production runs \`$RUNNING_TAG\`, which is NEWER than $SHA. Refusing a manual regression; use the rollback workflow, or re-dispatch with force_older=true."
              verdict false "REFUSED manual deploy by $GITHUB_ACTOR: production runs NEWER \`$RUNNING_TAG\`"
              exit 1
            fi
            echo "::warning::force_older=true: deploying $SHA over NEWER \`$RUNNING_TAG\`."
            verdict true "FORCED (force_older=true) manual deploy by $GITHUB_ACTOR over NEWER \`$RUNNING_TAG\` — reason: $REASON"
            exit 0
          fi
          DIVERGED=""
          if ! git merge-base --is-ancestor "$RUNNING_SHA" "$SHA"; then
            DIVERGED=" (DIVERGED: not on main's history — deploying main replaces it)"
            echo "::warning::Production runs \`$RUNNING_TAG\`, which has diverged from main; deploying $SHA restores main."
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            verdict true "manual deploy by $GITHUB_ACTOR over \`$RUNNING_TAG\`$DIVERGED — reason: $REASON"
          elif git diff --quiet "$RUNNING_SHA" "$SHA" -- \
                 services/Tims.Platform \
                 .github/workflows/deploy-platform-api.yml \
                 scripts/deploy/apprunner-image-payload.py; then
            verdict false "no change under services/Tims.Platform since the running \`$RUNNING_TAG\`$DIVERGED"
          else
            verdict true "C# changed since the running \`$RUNNING_TAG\`$DIVERGED and .NET Platform CI passed"
          fi

  deploy:
    name: Build, push and deploy
    needs: decide
    # The pause is re-checked here so a paused run never even queues for the lock.
    if: needs.decide.outputs.deploy == 'true' && vars.PLATFORM_API_AUTODEPLOY_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The one lock shared with rollback-platform-api.yml's `rollback` job — see the header above.
    concurrency:
      group: platform-api-mutation
      cancel-in-progress: false
      queue: max

    steps:
      - uses: actions/checkout@v5
        with:
          # The exact commit .NET Platform CI passed on — never "whatever main is now".
          ref: ${{ needs.decide.outputs.sha }}
          fetch-depth: 0 # the preflight resolves the live image's tag against history

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::747814092517:role/tims-ats-github-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The repository is IMMUTABLE (services/Tims.Platform/deploy/terraform/main.tf,
      # image_tag_mutability), so pushing a tag that already exists FAILS. That happens whenever two
      # runs approve the same commit (e.g. a manual dispatch racing the automatic run): the second
      # would die at the push, before its preflight could take the "already live -> skip" exit. So an
      # existing tag is reused, not rebuilt. Only ImageNotFoundException means "absent"; any other
      # error (auth, throttling, network) fails the job — an unreadable registry is not an empty one.
      # This runs inside the platform-api-mutation lock, so no other PIPELINE run can push the tag
      # between this check and the push below; only an out-of-band push can, and that push-time
      # failure is then the correct, loud outcome.
      - name: Check whether the image is already in ECR
        id: image
        env:
          TAG: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          if DIGEST="$(aws ecr describe-images --region "$AWS_REGION" --repository-name "$ECR_REPO" \
                 --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text 2>ecr-err.txt)"; then
            echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' \
              || { echo "::error::Unexpected describe-images result for $TAG: '$DIGEST'"; exit 1; }
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $ECR_REPO:$TAG already exists ($DIGEST); reusing it instead of rebuilding."
          elif grep -q 'ImageNotFoundException' ecr-err.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image $ECR_REPO:$TAG is not in ECR yet; building it."
          else
            cat ecr-err.txt >&2
            echo "::error::Cannot tell whether $ECR_REPO:$TAG exists; refusing to build or deploy blind."
            exit 1
          fi

      - name: Build and push the API image
        if: steps.image.outputs.exists == 'false'
        working-directory: services/Tims.Platform
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          # Tagged with the commit SHA on purpose, never a floating tag. check-deploy-freshness.sh
          # maps the running image tag back to a commit to compute drift; a `:latest` or `:main` tag
          # would make the running image unattributable and turn that gate into a no-op.
          docker build --platform linux/amd64 \
            -f src/Tims.Api/Dockerfile \
            -t "$REGISTRY/$ECR_REPO:$TAG" .
          docker push "$REGISTRY/$ECR_REPO:$TAG"

      - name: Deploy, preserving the full service configuration
        id: update
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.sha.outputs.short }}
          DECIDED_IMAGE: ${{ needs.decide.outputs.running_image }}
          TARGET_SHA: ${{ needs.decide.outputs.sha }}
          FORCE_OLDER: ${{ inputs.force_older }}
          # A snapshot, NOT a live read: GITHUB_TOKEN cannot read repository variables. The live guards
          # are the rollback-run queries and the live-image check in apprunner-preflight.sh.
          AUTODEPLOY_PAUSED: ${{ vars.PLATFORM_API_AUTODEPLOY_PAUSED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ARN="$(aws apprunner list-services --region "$AWS_REGION" \
                  --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" --output text)"
          test -n "$ARN" || { echo "::error::Service $SERVICE_NAME not found in $AWS_REGION"; exit 1; }

          aws apprunner describe-service --region "$AWS_REGION" --service-arn "$ARN" > live.json

          # LAST AWS read before update-service (this job holds platform-api-mutation, so no
          # pipeline rollback or deploy can run between here and update-service): not paused, no
          # rollback run queued or running, none requested since this run was created, and the live
          # image is the one `decide` read — or an OLDER commit another deploy put there while this one
          # waited. Exit 3 = production already runs this commit or a newer one: a successful no-op.
          if bash scripts/deploy/apprunner-preflight.sh "$ARN" "$DECIDED_IMAGE" --deploy; then RC=0; else RC=$?; fi
          case "$RC" in
            0) ;;
            3)
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              echo "### Deploy skipped: production already runs \`$TARGET_SHA\` or a newer commit" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *) exit "$RC" ;;
          esac

          # `update-service` takes a FULL source-configuration map. A partial one DROPS every env key
          # it omits — which would darken the 22 live flags and take ~13 production surfaces offline.
          # So the payload is derived from the live config and asserted to differ in exactly one field
          # (CHANGED /ImageRepository/ImageIdentifier) by the shared guard below. It runs AFTER
          # the preflight: when production already runs this image it refuses (nothing to change), and
          # that case must reach the preflight's exit-3 skip first. The rollback workflow
          # runs the SAME script, so both directions pass through one tested check.
          python3 scripts/deploy/apprunner-image-payload.py live.json "$REGISTRY/$ECR_REPO:$TAG" payload.json

          echo "ENV_BEFORE=$(python3 -c "import json;print(len(json.load(open('live.json'))['Service']['SourceConfiguration']['ImageRepository']['ImageConfiguration'].get('RuntimeEnvironmentVariables',{})))")" >> "$GITHUB_ENV"
          echo "SERVICE_ARN=$ARN" >> "$GITHUB_ENV"

          aws apprunner update-service --region "$AWS_REGION" \
            --service-arn "$ARN" --source-configuration file://payload.json \
            --query 'OperationId' --output text

      - name: Wait for the rollout
        if: steps.update.outputs.skipped != 'true'
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            sleep 15
            S="$(aws apprunner describe-service --region "$AWS_REGION" --service-arn "$SERVICE_ARN" \
                  --query 'Service.Status' --output text)"
            echo "[$i] $S"
            [ "$S" = "RUNNING" ] && exit 0
            case "$S" in CREATE_FAILED|DELETED) echo "::error::Service entered $S"; exit 1;; esac
          done
          echo "::error::Timed out waiting for RUNNING"
          exit 1

      - name: Verify the deployment
        if: steps.update.outputs.skipped != 'true'
        env:
          TAG: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          aws apprunner describe-service --region "$AWS_REGION" --service-arn "$SERVICE_ARN" > after.json

          GOT_IMAGE="$(python3 -c "import json;print(json.load(open('after.json'))['Service']['SourceConfiguration']['ImageRepository']['ImageIdentifier'])")"
          ENV_AFTER="$(python3 -c "import json;print(len(json.load(open('after.json'))['Service']['SourceConfiguration']['ImageRepository']['ImageConfiguration'].get('RuntimeEnvironmentVariables',{})))")"
          URL="$(python3 -c "import json;print(json.load(open('after.json'))['Service']['ServiceUrl'])")"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://$URL/health")"

          echo "image: $GOT_IMAGE"
          echo "env vars: $ENV_AFTER (was $ENV_BEFORE)"
          echo "GET /health -> $CODE"

          case "$GOT_IMAGE" in *:"$TAG") ;; *) echo "::error::Running image is not $TAG"; exit 1;; esac
          [ "$ENV_AFTER" = "$ENV_BEFORE" ] || { echo "::error::env var count changed: $ENV_BEFORE -> $ENV_AFTER"; exit 1; }
          [ "$CODE" = "200" ] || { echo "::error::/health returned $CODE"; exit 1; }

          echo "Deployed $TAG. Production is running main."
          {
            echo "### Deployed \`$TAG\`"
            echo
            echo "- image: \`$GOT_IMAGE\`"
            echo "- env vars: $ENV_AFTER (was $ENV_BEFORE)"
            echo "- GET /health: $CODE"
            echo "- to undo: run **Roll back platform API** with the previous tag (docs/runbooks/production-rollback-and-alerting.md)"
          } >> "$GITHUB_STEP_SUMMARY"
