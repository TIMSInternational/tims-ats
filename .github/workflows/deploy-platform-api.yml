name: Deploy platform API

# THE ROOT-CAUSE FIX for the 2026-08-31 incident.
#
# The live App Runner service was found running an image built 2026-07-28 — 242 commits and 34 days
# behind `main`, with 45 undeployed commits touching services/Tims.Platform and seven completed slices
# that had never executed. Nothing was broken, because every merged endpoint is dark behind a
# default-false flag, and that is exactly why nobody noticed.
#
# The mechanical cause was small and total: `dotnet-platform.yml` runs `docker build` to VERIFY the
# image and then throws it away. Nothing ever pushed it, and nothing ever deployed it. Deploys were a
# manual ritual, so the gap opened in silence and stayed open until someone thought to compare a
# running image tag against main by hand.
#
# The real cost was not an outage. Three finished domains sat stuck at step 5 with no visible cause,
# and the FX stale-pin incident carried a recorded remedy — "run runbook A or B" — that was NOT
# EXECUTABLE for two weeks, because both code paths post-dated the running image.
#
# This workflow makes that state unreachable: every merge to main that touches the C# service builds,
# pushes and deploys it. `scripts/deploy/check-deploy-freshness.sh` (/gate check 21) remains the
# backstop — a control that lives only inside the thing it guards is not a control.

# ── GATED ON THE .NET TESTS (F16, 2026-09-29) ──────────────────────────────────────────────────────
# This workflow used to fire on `push` to main in PARALLEL with `.NET Platform CI`, so a merge whose
# C# tests failed was built, pushed and deployed anyway — the tests could only report the damage after
# production already ran it. It now runs on `workflow_run`: only AFTER `.NET Platform CI` completes,
# and the `decide` job refuses anything but a SUCCESSFUL, PUSH-triggered run on main of THIS repository
# (`branches: [main]` alone would also match a fork PR whose head branch happens to be named `main`).
# The deployed commit is `workflow_run.head_sha` — the exact commit the tests passed on — never "the
# tip of main at the time the deploy happened to start".
#
# Path semantics are preserved in two layers: `.NET Platform CI` is itself path-filtered (so this
# never fires for web-only merges), and because its filter is BROADER than the C# service
# (packages/db, scripts/**, ...), `decide` additionally diffs the tested commit against the RUNNING
# image's commit and skips when nothing under services/Tims.Platform (or this file) changed.
#
# `workflow_dispatch` remains the manual escape hatch (reason required, recorded in the job summary).
# Roll BACK with `rollback-platform-api.yml`, never by dispatching this against an old commit.
on:
  workflow_run:
    workflows: [".NET Platform CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you deploying by hand? (recorded in the job summary)"
        required: true

# NEVER cancel a deploy in flight. `cancel-in-progress: true` — correct for CI, where a superseded run
# is wasted work — would here abort a rolling App Runner deployment partway through and leave the
# service in an operation state that blocks the next run.
#
# The rollback workflow deliberately uses its OWN group. GitHub keeps one PENDING run per group and
# REPLACES it with any newer one, so a shared group would let a CI-triggered deploy silently cancel a
# queued emergency rollback. Instead the two coordinate explicitly: rollback refuses unless deploys
# are already paused, and this workflow runs scripts/deploy/apprunner-preflight.sh right before
# update-service (refuses while paused, while any rollback run is queued or running, or if the live
# image changed since `decide` read it).
concurrency:
  group: deploy-platform-api
  cancel-in-progress: false

permissions:
  id-token: write # OIDC federation to AWS. No long-lived keys exist for this repo.
  contents: read
  actions: read # apprunner-preflight.sh lists rollback-platform-api.yml runs before update-service.

env:
  AWS_REGION: us-west-2 # NOT us-east-1 — that account holds unrelated NexaDev projects.
  SERVICE_NAME: tims-platform-api
  ECR_REPO: tims-platform-api

jobs:
  decide:
    name: Decide whether to deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level gate: a failed or cancelled test run, a pull_request-triggered run, or a run whose head
    # came from a fork never reaches a step that holds AWS credentials.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sha: ${{ steps.target.outputs.sha }}
      running_image: ${{ steps.decide.outputs.running_image }}

    steps:
      - name: Resolve the commit to deploy
        id: target
        env:
          EVENT: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$DISPATCH_REF" = "refs/heads/main" ] \
              || { echo "::error::Manual deploys run from main only (got $DISPATCH_REF)."; exit 1; }
            SHA="$DISPATCH_SHA"
          else
            SHA="$TESTED_SHA"
          fi
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Not a commit SHA: '$SHA'"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0 # the running image's commit must be resolvable for the diff below

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::747814092517:role/tims-ats-github-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Compare the tested commit with the running image
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ steps.target.outputs.sha }}
          REASON: ${{ inputs.reason }}
          AUTODEPLOY_PAUSED: ${{ vars.PLATFORM_API_AUTODEPLOY_PAUSED }}
        run: |
          set -euo pipefail
          verdict() {
            echo "deploy=$1" >> "$GITHUB_OUTPUT"
            { echo "### Deploy decision: $1"; echo; echo "- commit: \`$SHA\`"; echo "- $2"; } >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=$1 — $2"
          }

          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::$SHA is not on main. Refusing to deploy it."; exit 1; }

          # Set FIRST by the rollback runbook (the rollback workflow refuses to start without it).
          # While it is set NO deploy runs, automatic or manual, so a green merge cannot put the bad
          # commit straight back. Unset it once the fix is on main.
          if [ "$AUTODEPLOY_PAUSED" = "true" ]; then
            echo "::warning::Deploys are paused (repo variable PLATFORM_API_AUTODEPLOY_PAUSED=true)."
            verdict false "deploys are PAUSED for a rollback — unset PLATFORM_API_AUTODEPLOY_PAUSED to resume"
            exit 0
          fi

          ARN="$(aws apprunner list-services --region "$AWS_REGION" \
                  --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" --output text)"
          test -n "$ARN" || { echo "::error::Service $SERVICE_NAME not found in $AWS_REGION"; exit 1; }
          RUNNING_IMAGE="$(aws apprunner describe-service --region "$AWS_REGION" --service-arn "$ARN" \
                  --query 'Service.SourceConfiguration.ImageRepository.ImageIdentifier' --output text)"
          RUNNING_TAG="${RUNNING_IMAGE##*:}"
          echo "running image: $RUNNING_IMAGE"
          # The deploy job re-checks, right before update-service, that this is STILL the live image.
          echo "running_image=$RUNNING_IMAGE" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            verdict true "manual deploy by $GITHUB_ACTOR — reason: $REASON"
            exit 0
          fi

          RUNNING_SHA=""
          if echo "$RUNNING_TAG" | grep -Eq '^[0-9a-f]{7,40}$'; then
            RUNNING_SHA="$(git rev-parse --verify --quiet "${RUNNING_TAG}^{commit}" || true)"
          fi

          if [ -z "$RUNNING_SHA" ]; then
            # Unattributable running image (e.g. a hand-pushed tag). The tested commit is on main and
            # green, so deploying it RESTORES attributability — skipping would leave the drift in place.
            echo "::warning::Running tag '$RUNNING_TAG' does not resolve to a commit; deploying."
            verdict true "running tag \`$RUNNING_TAG\` is unattributable — deploying the tested commit"
          elif [ "$RUNNING_SHA" = "$SHA" ]; then
            verdict false "production already runs this commit"
          elif git merge-base --is-ancestor "$SHA" "$RUNNING_SHA"; then
            # Test runs can finish out of order. Deploying an older green commit after a newer one
            # would silently roll production BACK.
            verdict false "production runs \`$RUNNING_TAG\`, which is NEWER than the tested commit"
          elif git diff --quiet "$RUNNING_SHA" "$SHA" -- \
                 services/Tims.Platform \
                 .github/workflows/deploy-platform-api.yml \
                 scripts/deploy/apprunner-image-payload.py; then
            verdict false "no change under services/Tims.Platform since the running \`$RUNNING_TAG\`"
          else
            verdict true "C# changed since the running \`$RUNNING_TAG\` and .NET Platform CI passed"
          fi

  deploy:
    name: Build, push and deploy
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          # The exact commit .NET Platform CI passed on — never "whatever main is now".
          ref: ${{ needs.decide.outputs.sha }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::747814092517:role/tims-ats-github-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the API image
        working-directory: services/Tims.Platform
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          # Tagged with the commit SHA on purpose, never a floating tag. check-deploy-freshness.sh
          # maps the running image tag back to a commit to compute drift; a `:latest` or `:main` tag
          # would make the running image unattributable and turn that gate into a no-op.
          docker build --platform linux/amd64 \
            -f src/Tims.Api/Dockerfile \
            -t "$REGISTRY/$ECR_REPO:$TAG" .
          docker push "$REGISTRY/$ECR_REPO:$TAG"

      - name: Deploy, preserving the full service configuration
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.sha.outputs.short }}
          DECIDED_IMAGE: ${{ needs.decide.outputs.running_image }}
          # A snapshot, NOT a live read: GITHUB_TOKEN cannot read repository variables. The live guards
          # are the rollback-run query and the unchanged-image check in apprunner-preflight.sh.
          AUTODEPLOY_PAUSED: ${{ vars.PLATFORM_API_AUTODEPLOY_PAUSED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ARN="$(aws apprunner list-services --region "$AWS_REGION" \
                  --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" --output text)"
          test -n "$ARN" || { echo "::error::Service $SERVICE_NAME not found in $AWS_REGION"; exit 1; }

          aws apprunner describe-service --region "$AWS_REGION" --service-arn "$ARN" > live.json

          # `update-service` takes a FULL source-configuration map. A partial one DROPS every env key
          # it omits — which would darken the 22 live flags and take ~13 production surfaces offline.
          # So the payload is derived from the live config and asserted to differ in exactly one field
          # (CHANGED /ImageRepository/ImageIdentifier) by the shared guard below. The rollback workflow
          # runs the SAME script, so both directions pass through one tested check.
          python3 scripts/deploy/apprunner-image-payload.py live.json "$REGISTRY/$ECR_REPO:$TAG" payload.json

          # LAST check, immediately before update-service: not paused, no rollback run queued or in
          # progress, and the live image is still the one `decide` compared against (a rollback that
          # finished during the build would otherwise be silently overwritten).
          bash scripts/deploy/apprunner-preflight.sh "$ARN" "$DECIDED_IMAGE" --deploy

          echo "ENV_BEFORE=$(python3 -c "import json;print(len(json.load(open('live.json'))['Service']['SourceConfiguration']['ImageRepository']['ImageConfiguration'].get('RuntimeEnvironmentVariables',{})))")" >> "$GITHUB_ENV"
          echo "SERVICE_ARN=$ARN" >> "$GITHUB_ENV"

          aws apprunner update-service --region "$AWS_REGION" \
            --service-arn "$ARN" --source-configuration file://payload.json \
            --query 'OperationId' --output text

      - name: Wait for the rollout
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            sleep 15
            S="$(aws apprunner describe-service --region "$AWS_REGION" --service-arn "$SERVICE_ARN" \
                  --query 'Service.Status' --output text)"
            echo "[$i] $S"
            [ "$S" = "RUNNING" ] && exit 0
            case "$S" in CREATE_FAILED|DELETED) echo "::error::Service entered $S"; exit 1;; esac
          done
          echo "::error::Timed out waiting for RUNNING"
          exit 1

      - name: Verify the deployment
        env:
          TAG: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          aws apprunner describe-service --region "$AWS_REGION" --service-arn "$SERVICE_ARN" > after.json

          GOT_IMAGE="$(python3 -c "import json;print(json.load(open('after.json'))['Service']['SourceConfiguration']['ImageRepository']['ImageIdentifier'])")"
          ENV_AFTER="$(python3 -c "import json;print(len(json.load(open('after.json'))['Service']['SourceConfiguration']['ImageRepository']['ImageConfiguration'].get('RuntimeEnvironmentVariables',{})))")"
          URL="$(python3 -c "import json;print(json.load(open('after.json'))['Service']['ServiceUrl'])")"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://$URL/health")"

          echo "image: $GOT_IMAGE"
          echo "env vars: $ENV_AFTER (was $ENV_BEFORE)"
          echo "GET /health -> $CODE"

          case "$GOT_IMAGE" in *:"$TAG") ;; *) echo "::error::Running image is not $TAG"; exit 1;; esac
          [ "$ENV_AFTER" = "$ENV_BEFORE" ] || { echo "::error::env var count changed: $ENV_BEFORE -> $ENV_AFTER"; exit 1; }
          [ "$CODE" = "200" ] || { echo "::error::/health returned $CODE"; exit 1; }

          echo "Deployed $TAG. Production is running main."
          {
            echo "### Deployed \`$TAG\`"
            echo
            echo "- image: \`$GOT_IMAGE\`"
            echo "- env vars: $ENV_AFTER (was $ENV_BEFORE)"
            echo "- GET /health: $CODE"
            echo "- to undo: run **Roll back platform API** with the previous tag (docs/runbooks/production-rollback-and-alerting.md)"
          } >> "$GITHUB_STEP_SUMMARY"
