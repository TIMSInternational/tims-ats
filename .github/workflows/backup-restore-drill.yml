# Weekly production backup-restore drill.
#
# WHAT IT PROVES
# --------------
# Takes a consistent logical dump of production (public + auth) at one exported snapshot, restores it
# into an EPHEMERAL supabase/postgres service container on this runner, and verifies the restored copy
# is complete: exact per-table row counts at the snapshot, and an identical schema inventory (tables,
# columns, indexes, constraints, RLS flags, policies, triggers incl. enabled state, full function definitions). Reports RTO and dump size.
#
# It does NOT prove Supabase's managed daily backups / PITR — that is a separate quarterly manual
# step. See docs/runbooks/backup-restore.md, which also has the one-time setup.
#
# THE EXIT-CODE CONTRACT (same as nightly-db-controls.yml, #124 / #38)
#   0 = verified · 1 = ran, FOUND a problem · 2 = COULD NOT RUN
# Exit 2 fails this job exactly as loudly as exit 1. A drill that cannot run and reports green is the
# #38 failure mode: a control that did not run, presenting as a control that passed.
#
# PII: production rows (real candidate data) exist only in the dump file on this ephemeral runner and
# in the service container, both destroyed with the job. The dump is never uploaded as an artifact and
# is deleted by the script's EXIT trap. The step summary and log carry only names, counts, sizes and
# timings; restore error message text is never printed (object + condition name only).
#
# ⚠️  REQUIRES the `PROD_BACKUP_DRILL_URL` secret: the SESSION-pooler URL (port 5432) of the dedicated
#     `backup_drill_reader` role created by scripts/backup-drill/create-drill-role.sql. That role has
#     BYPASSRLS — the file explains why a complete backup needs it — so the secret is an
#     access-register entry (#40). Do not reuse PROD_DIRECT_URL / ci_readonly: it obeys RLS and would
#     dump an incomplete backup (the script refuses such a role with exit 2).
#
# Schedule/dispatch only — never on pull_request, so production credentials are unreachable from a
# fork PR (pinned by tests/governance/ci-triggers.test.ts).

name: Backup-Restore Drill

on:
  schedule:
    # Sundays 06:00 UTC — lowest-traffic window, one hour before the nightly DB controls.
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backup-restore-drill
  cancel-in-progress: false

jobs:
  drill:
    name: Restore production into an ephemeral Postgres and verify it
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      restore-target:
        # Pinned by exact tag: Supabase Postgres 17.6 (production runs 17.6), multi-arch. Bump
        # deliberately, alongside DRILL_IMAGE in scripts/backup-drill/local-e2e.sh.
        image: supabase/postgres:17.6.1.178
        env:
          # Not a credential of anything persistent: this container lives only for this job, on this
          # runner. Derived per run rather than a literal so no password string sits in the repo.
          POSTGRES_PASSWORD: drill-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@v5

      - name: Fail fast if the credential is absent
        env:
          PROD_BACKUP_DRILL_URL: ${{ secrets.PROD_BACKUP_DRILL_URL }}
        run: |
          if [ -z "$PROD_BACKUP_DRILL_URL" ]; then
            echo "::error title=Backup-restore drill did not run::PROD_BACKUP_DRILL_URL is not set."
            echo "This drill verifies nothing without it. Failing rather than passing vacuously — see #124/#38." >&2
            echo "### ⚠️ Backup-restore drill DID NOT RUN — \`PROD_BACKUP_DRILL_URL\` is not set" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Install PostgreSQL 17 client (pg_dump must be >= the server major)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Wait for the restore target
        env:
          PGPASSWORD: drill-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # The health check can pass before the image's init scripts finish; wait for the superuser
          # the restore actually uses.
          for i in $(seq 1 60); do
            if /usr/lib/postgresql/17/bin/psql -X -At -h localhost -U supabase_admin -d postgres -c 'select 1' >/dev/null 2>&1; then
              echo "restore target ready"; exit 0
            fi
            sleep 3
          done
          echo "::error title=Backup-restore drill did not run::the restore-target container never accepted connections."
          exit 1

      - name: Mark the restore target as this run's disposable database
        env:
          PGPASSWORD: drill-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # run-drill.sh DROPs every dumped schema on the target, so it refuses any database that does
          # not carry THIS run's marker. Only this step, inside this job's own service container,
          # writes it — an empty-looking database elsewhere can never qualify.
          /usr/lib/postgresql/17/bin/psql -X -v ON_ERROR_STOP=1 -h localhost -U supabase_admin -d postgres \
            -c 'CREATE SCHEMA drill_meta' \
            -c 'CREATE TABLE drill_meta.target_marker (run_id text PRIMARY KEY)' \
            -c "INSERT INTO drill_meta.target_marker VALUES ('${{ github.run_id }}-${{ github.run_attempt }}')"

      - name: Run the drill
        env:
          DRILL_SOURCE_URL: ${{ secrets.PROD_BACKUP_DRILL_URL }}
          DRILL_TARGET_URL: postgresql://supabase_admin:drill-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/postgres
          DRILL_TARGET_MARKER: ${{ github.run_id }}-${{ github.run_attempt }}
          # Full TLS verification against the committed Supabase Root 2021 CA — never downgraded.
          DRILL_SOURCE_SSLMODE: verify-full
          DRILL_SOURCE_SSLROOTCERT: scripts/parity/supabase-root-ca.pem
          DRILL_SCHEMAS: public auth
          # Production has 119 public tables plus auth's. A drill that sees fewer is looking at the
          # wrong database or lost its grants — exit 2, not a vacuous pass.
          DRILL_MIN_TABLES: '100'
          DRILL_PG_BIN: /usr/lib/postgresql/17/bin
        run: |
          # NOT `set -e`: the exit code is classified explicitly below.
          set +e
          bash scripts/backup-drill/run-drill.sh
          rc=$?
          case $rc in
            0) echo "✅ backup-restore drill verified" ;;
            1) echo "::error title=Backup-restore drill FOUND A PROBLEM::The production backup did not restore completely. See the step summary and log."
               exit 1 ;;
            2) echo "::error title=Backup-restore drill DID NOT RUN::Nothing was verified. Treating as failure (#38)."
               exit 1 ;;
            *) echo "::error title=Backup-restore drill exited $rc::Unexpected exit code. Treated as did-not-run, never as a pass."
               exit 1 ;;
          esac

# Deliberately absent: `actions/upload-artifact`. The dump contains production PII and must never
# leave the runner. tests/governance/backup-restore-drill.test.ts fails if an upload step appears.
