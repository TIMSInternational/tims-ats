name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "postgresql://postgres:ci@localhost:5432/ci"
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  # ========================================
  # Type Check — API + Web (parallel)
  # ========================================
  typecheck:
    name: Type Check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tims/db exec prisma generate --schema prisma/schema
      - name: Type check API
        if: matrix.target == 'api'
        run: pnpm --filter @tims/api exec tsc --noEmit
      - name: Type check Web
        if: matrix.target == 'web'
        run: cd apps/web && npx tsc --noEmit

  # ========================================
  # Security Tests (56 tests)
  # ========================================
  security-tests:
    name: Security Audit (56 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tims/db exec prisma generate --schema prisma/schema
      - run: npx vitest run

  # ========================================
  # Gitleaks — Secret Scanning
  # ========================================
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v3 requires a paid org license for org repos (gitleaks.io).
      # Run the free OSS CLI directly instead — identical scan, no license needed.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks git --no-banner .

  # ========================================
  # Code Quality Gates
  # ========================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No any types in frontend
        run: |
          # Exclude tests and comment lines (// line comments, /* */ block
          # comments) so the word "any" in prose doesn't false-trip the gate.
          matches=$(grep -rn ": any\b" apps/web/app/ --include="*.tsx" --include="*.ts" 2>/dev/null \
            | grep -v node_modules \
            | grep -v ".test." \
            | grep -vE ':[0-9]+:[[:space:]]*(//|\*|/\*)' || true)
          count=$(printf '%s' "$matches" | grep -c . || true)
          if [ "$count" -gt "0" ]; then
            echo "::error::Found $count 'any' type annotations in frontend"
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: No unsafe SQL patterns
        run: |
          if grep -rn 'executeRawUnsafe\|queryRawUnsafe' packages/api/src/ --include="*.ts" 2>/dev/null; then
            echo "::error::Found executeRawUnsafe or queryRawUnsafe — SQL injection risk"
            exit 1
          fi

      - name: No XSS patterns
        run: |
          if grep -rn 'dangerouslySetInnerHTML' apps/web/ --include="*.tsx" --include="*.ts" 2>/dev/null | grep -v node_modules; then
            echo "::error::Found dangerouslySetInnerHTML — XSS risk"
            exit 1
          fi

      - name: No ts-ignore or ts-nocheck
        run: |
          if grep -rn '@ts-ignore\|@ts-nocheck' packages/ apps/web/app/ apps/web/lib/ apps/web/components/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v node_modules; then
            echo "::error::Found @ts-ignore or @ts-nocheck"
            exit 1
          fi

      - name: No eval or new Function
        run: |
          if grep -rn '\beval\s*(' packages/ apps/web/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v node_modules | grep -v ".test."; then
            echo "::error::Found eval() — code injection risk"
            exit 1
          fi

      - name: No service_role key in client code
        run: |
          if grep -rn 'service_role' apps/web/app/ apps/web/components/ apps/web/lib/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v node_modules | grep -v ".test."; then
            echo "::error::Found service_role key reference in client code"
            exit 1
          fi

      - name: AI has one door (no Bedrock/AI-SDK outside packages/ai)
        run: |
          if grep -rn "@ai-sdk\|createAmazonBedrock\|bedrockGenerate\|from 'ai'\|from \"ai\"" packages apps --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v node_modules | grep -v "packages/ai/"; then
            echo "::error::Bedrock/AI-SDK used outside packages/ai — every AI call MUST go through @tims/ai invokeAgent (CLAUDE.md rule #2)"
            exit 1
          fi

      # Tripwire for the obvious spelling only — aliasing/Object.assign slip it; real enforcement = scopeWhereFor() API + review
      - name: Scope fragments compose via AND, never spread
        run: |
          if grep -rn '\.\.\.[[:alnum:]_$.]*access\.where\|\.\.\.[[:alnum:]_$.]*scopeWhere' packages/api/src --include="*.ts" 2>/dev/null; then
            echo "::error::access/scope where-fragments must compose inside AND: [...], never object spread (scope-widening)"
            exit 1
          fi

  # ========================================
  # Build (depends on typecheck + security)
  # ========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, security-tests, code-quality]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tims/db exec prisma generate --schema prisma/schema
      - name: Build
        run: pnpm --filter @tims/web build
        env:
          SKIP_ENV_VALIDATION: "true"
