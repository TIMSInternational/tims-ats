name: CI

on:
  push:
    branches: [main]
  # NO `branches:` filter, deliberately. Restricting to [main] meant a PR whose BASE IS A
  # BRANCH — every stacked PR — ran NO checks at all: no type check, no vitest, no security
  # audit, no verification-gate. Only Vercel reported, so the PR looked green while nothing
  # had verified it. That is a gate that silently does not run, which is the exact failure
  # class this repo keeps getting bitten by. Pinned by tests/governance/ci-triggers.test.ts.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "postgresql://postgres:ci@localhost:5432/ci"
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  # ========================================
  # Type Check — API + Web (parallel)
  # ========================================
  typecheck:
    name: Type Check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tims/db exec prisma generate --schema prisma/schema
      - name: Type check API
        if: matrix.target == 'api'
        run: pnpm --filter @tims/api exec tsc --noEmit
      - name: Type check Web
        if: matrix.target == 'web'
        run: cd apps/web && npx tsc --noEmit

  # ========================================
  # Security Tests (56 tests)
  # ========================================
  security-tests:
    name: Security Audit (56 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tims/db exec prisma generate --schema prisma/schema
      - run: npx vitest run

  # ========================================
  # Gitleaks — Secret Scanning
  # ========================================
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v3 requires a paid org license for org repos (gitleaks.io).
      # Run the free OSS CLI directly instead — identical scan, no license needed.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks git --no-banner .

  # ========================================
  # Code Quality Gates
  # ========================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No any types in frontend
        run: |
          # Exclude tests and comment lines (// line comments, /* */ block
          # comments) so the word "any" in prose doesn't false-trip the gate.
          matches=$(grep -rn ": any\b" apps/web/app/ --include="*.tsx" --include="*.ts" 2>/dev/null \
            | grep -v node_modules \
            | grep -v ".test." \
            | grep -vE ':[0-9]+:[[:space:]]*(//|\*|/\*)' || true)
          count=$(printf '%s' "$matches" | grep -c . || true)
          if [ "$count" -gt "0" ]; then
            echo "::error::Found $count 'any' type annotations in frontend"
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: No unsafe SQL patterns
        run: |
          if grep -rn 'executeRawUnsafe\|queryRawUnsafe' packages/api/src/ --include="*.ts" 2>/dev/null; then
            echo "::error::Found executeRawUnsafe or queryRawUnsafe — SQL injection risk"
            exit 1
          fi

      - name: No XSS patterns
        run: |
          if grep -rn 'dangerouslySetInnerHTML' apps/web/ --include="*.tsx" --include="*.ts" 2>/dev/null | grep -v node_modules; then
            echo "::error::Found dangerouslySetInnerHTML — XSS risk"
            exit 1
          fi

      - name: No ts-ignore or ts-nocheck
        run: |
          if grep -rn '@ts-ignore\|@ts-nocheck' packages/ apps/web/app/ apps/web/lib/ apps/web/components/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v node_modules; then
            echo "::error::Found @ts-ignore or @ts-nocheck"
            exit 1
          fi

      - name: No eval or new Function
        run: |
          if grep -rn '\beval\s*(' packages/ apps/web/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v node_modules | grep -v ".test."; then
            echo "::error::Found eval() — code injection risk"
            exit 1
          fi

      - name: No service_role key in client code
        run: |
          if grep -rn 'service_role' apps/web/app/ apps/web/components/ apps/web/lib/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v node_modules | grep -v ".test."; then
            echo "::error::Found service_role key reference in client code"
            exit 1
          fi

      - name: AI has one door (no Bedrock/AI-SDK outside packages/ai)
        run: |
          if grep -rn "@ai-sdk\|createAmazonBedrock\|bedrockGenerate\|from 'ai'\|from \"ai\"" packages apps --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v node_modules | grep -v "packages/ai/"; then
            echo "::error::Bedrock/AI-SDK used outside packages/ai — every AI call MUST go through @tims/ai invokeAgent (CLAUDE.md rule #2)"
            exit 1
          fi

      # Tripwire for the obvious spelling only — aliasing/Object.assign slip it; real enforcement = scopeWhereFor() API + review
      - name: Scope fragments compose via AND, never spread
        run: |
          if grep -rn '\.\.\.[[:alnum:]_$.]*access\.where\|\.\.\.[[:alnum:]_$.]*scopeWhere' packages/api/src --include="*.ts" 2>/dev/null; then
            echo "::error::access/scope where-fragments must compose inside AND: [...], never object spread (scope-widening)"
            exit 1
          fi

  # ========================================
  # Build (depends on typecheck + security)
  # ========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, security-tests, code-quality]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tims/db exec prisma generate --schema prisma/schema
      - name: Build
        run: pnpm --filter @tims/web build
        env:
          SKIP_ENV_VALIDATION: "true"

  # ========================================
  # Verification gate (#38)
  #
  # Does NOT prove a review happened — it makes an ABSENT one visible in GitHub
  # instead of buried in a session log.
  #
  # Context: `.claude/rules/verification.md` mandates an adversarial cross-model
  # pass at every review gate. It did not run once between 2026-07-22 and
  # 2026-08-02, and every build stayed green, because the Codex CLI exits 0 when
  # quota-blocked. PRs #18, #19, #22, #24, #112 and #113 all merged without it —
  # #22 and #24 were data-exposure security fixes.
  #
  # Zero-cost: no checkout, no install, pure API read. Modeled on table-ownership.
  # ========================================
  verification-gate:
    name: Verification section present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Require a Verification section or an explicit waiver
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if grep -qiE '^[[:space:]]*#{1,4}[[:space:]]*Verification' <<<"$BODY"; then
            echo "✓ PR body has a Verification section."
            exit 0
          fi
          if grep -qiE '^[[:space:]]*Verification-waiver:[[:space:]]*\S' <<<"$BODY"; then
            echo "⚠ Verification WAIVED:"
            grep -iE '^[[:space:]]*Verification-waiver:' <<<"$BODY" | sed 's/^/    /'
            echo ""
            echo "Recorded in the PR body, which is the point — a skipped review is now visible."
            exit 0
          fi
          echo "::error::PR body has no '## Verification' section and no 'Verification-waiver:' line."
          echo ""
          echo "Add a '## Verification' section listing what you actually ran, e.g.:"
          echo ""
          echo "  ## Verification"
          echo "  - [x] pnpm --filter @tims/api exec tsc --noEmit"
          echo "  - [x] npx vitest run"
          echo "  - [x] bash scripts/verification/codex-review.sh   (exit 2 — quota-blocked; ran 3-lens fallback)"
          echo ""
          echo "Or, if verification genuinely does not apply, state why on one line:"
          echo ""
          echo "  Verification-waiver: docs-only change, no code paths touched"
          echo ""
          echo "See .claude/rules/verification.md"
          exit 1
