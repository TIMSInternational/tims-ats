name: E2E

# Playwright journeys (company + candidate) against a throwaway, LOCAL-ONLY stack: Supabase CLI,
# the production-schema baseline + seeds, the C# API container, LocalStack (SES/S3), Redis, Caddy
# (TLS) and `next start`. The whole bring-up lives in scripts/e2e/up.sh so CI and local runs are
# the same code path — this file only installs tools, calls the scripts and keeps the evidence.
#
# A separate workflow (not a ci.yml job) on purpose: it needs Docker + ~20 min, its own timeout and
# concurrency group, and it must not delay or couple to the fast type-check/vitest jobs.
#
# No secrets: every credential is generated per run inside the runner (signing key, service keys,
# passwords) and is never uploaded. External AI/video is NOT unreachable by construction (the
# Bedrock SDK and the ElevenLabs client hardcode their hosts); what holds is: no Bedrock, Daily or
# ElevenLabs credentials are provided (blanked, and scripts/e2e/env-guard.mjs refuses to start if a
# .env file would supply any), no journey step triggers AI, and the specs abort any browser request
# to Daily/ElevenLabs/LiveKit. A server-side call would go out unauthenticated and fail.

on:
  push:
    branches: [main]
  # No `branches:` filter — a stacked PR must run this too (tests/governance/ci-triggers.test.ts).
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  journeys:
    name: Playwright journeys
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Pinned to the CLI version the stack was built and verified with.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3 (what @v1 resolved to on 2026-09-29)
        with:
          version: 2.39.2

      - run: pnpm install --frozen-lockfile

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'packages/*/src/**') }}
          restore-keys: |
            nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}-chromium

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @tims/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @tims/e2e exec playwright install-deps chromium

      - name: Bring up the local E2E stack
        run: bash scripts/e2e/up.sh

      - name: Run the journeys
        run: pnpm --filter @tims/e2e exec playwright test

      # A FLAKY test (failed, then passed on retry) leaves the job green — and the evidence used to be
      # uploaded only on job failure, so a deterministic first-attempt failure could never be diagnosed
      # (#330). playwright.config.ts keeps a trace/screenshot/video only for failed attempts
      # (retain-on-failure), so a trace.zip under test-results means at least one attempt failed.
      - name: Detect failed attempts (flaky tests included)
        id: attempts
        if: ${{ !cancelled() }}
        run: |
          if [ -d e2e/test-results ] && find e2e/test-results -name trace.zip -print -quit | grep -q .; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            n=$(find e2e/test-results -name trace.zip | wc -l | tr -d ' ')
            echo "::warning title=E2E had failed attempts::$n failed attempt(s) — traces uploaded as the playwright-report artifact, even if a retry passed."
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect service logs
        if: ${{ failure() || steps.attempts.outputs.failed == 'true' }}
        run: |
          mkdir -p e2e/.state/logs/containers
          for c in api caddy localstack; do
            docker logs "tims-e2e-ci-$c" > "e2e/.state/logs/containers/$c.log" 2>&1 || true
          done
          # supabase-start.log echoes the (per-run, local) service keys — never upload it.
          rm -f e2e/.state/logs/supabase-start.log e2e/.state/logs/owner-create.json

      - name: Upload Playwright report and traces
        if: ${{ failure() || steps.attempts.outputs.failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

      - name: Upload stack logs
        if: ${{ failure() || steps.attempts.outputs.failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-logs
          path: e2e/.state/logs
          retention-days: 7

      - name: Tear down
        if: always()
        run: bash scripts/e2e/down.sh
