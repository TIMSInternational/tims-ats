# Nightly live-database controls — /gate checks 14, 16 and 17 (#124).
#
# WHY A SCHEDULED JOB AND NOT A PR CHECK
# --------------------------------------
# These three controls are the only things in this repo that assert anything about PRODUCTION rather than
# about the repository. Until now they ran only when a human ran `/gate`, which is the same
# "someone must remember" mechanism that let #111 sit in production for ~14 months.
#
# A schedule, rather than per-PR, is a deliberate trade recorded on #124:
#   - it catches the OUT-OF-BAND change — a Supabase dashboard edit, a hand-applied GRANT — which is the
#     #111 scenario and the one no PR check can ever see, because there is no PR;
#   - it keeps production credentials off the pull_request path entirely, where a fork PR could reach them.
# It is weaker at "this PR changed the schema". `/gate` still covers that at ship time, and always will —
# CI here is additive, never a replacement (#124 acceptance criteria).
#
# THE EXIT-CODE CONTRACT IS THE WHOLE POINT
# -----------------------------------------
#   0 = ran, clean · 1 = ran, FOUND something · 2 = COULD NOT RUN
# Exit 2 must fail this job as loudly as exit 1. A control that cannot run and reports green is the #38
# failure mode, which cost this repo six unreviewed PRs. All three scripts only gained a distinguishable
# exit 2 in #136 and #138 — before that this job was literally unbuildable to its own acceptance criteria.
#
# ⚠️  REQUIRES the `PROD_DIRECT_URL` secret. This is the FIRST GitHub secret in this repository, so the
#     read-only role behind it is an access-register entry — see #40. Grants it needs, and nothing more:
#
#       CREATE ROLE ci_readonly LOGIN PASSWORD '…' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
#       GRANT CONNECT ON DATABASE postgres TO ci_readonly;
#       GRANT USAGE ON SCHEMA public, supabase_migrations TO ci_readonly;
#       GRANT SELECT ON ALL TABLES IN SCHEMA public, supabase_migrations TO ci_readonly;
#       ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO ci_readonly;
#     then, as postgres:  psql -v ON_ERROR_STOP=1 -f scripts/db/ci-readonly-probe-role.sql
#
#     ci_readonly MUST NOT be a member of app_tenant (#292). It used to be, because check 14's probe did
#     `SET LOCAL ROLE app_tenant` — and app_tenant holds INSERT/UPDATE/DELETE on the tenant tables, so the
#     "read-only" credential could assume DML with one statement. NOINHERIT does not prevent SET ROLE.
#     The provisioning script creates `ci_rls_probe` (NOLOGIN, NOBYPASSRLS, SELECT-only), lets ci_readonly
#     SET ROLE to it, REVOKEs app_tenant from ci_readonly, and asserts all of that before committing.
#     Probing as ci_rls_probe is equivalent because every public policy applies TO public — check 14
#     asserts that invariant nightly (`policy-role-scope`). Check 17 reads ACLs and needs no membership.
#     Until the script has run, check 14 exits 2 naming it: loud, never a silent skip.
#
#     TLS: the secret MUST carry sslmode=verify-full. The pre-step below refuses anything else, and
#     PGSSLROOTCERT pins the committed Supabase CA for both libpq (pg_dump, check 16) and the Node checks.
#
#     Use the SESSION pooler (:5432). The transaction pooler (:6543) cannot `SET LOCAL ROLE` at all, which
#     check 14 also depends on. `pg_dump --schema-only` needs no table data, but check 14's probe DOES read
#     rows (`count(*)` only) — so SELECT is required, not merely catalog access.
#
#     The whole block above was executed against a throwaway PostgreSQL 17 cluster before being written
#     here. It is not SQL composed from memory and handed to someone to run against production.

name: Nightly DB Controls

on:
  schedule:
    # 07:00 UTC daily — after any overnight deploy, before European working hours.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      capture_baseline:
        description: >-
          Re-capture the production schema baseline (#328) INSTEAD of running the checks. main only.
          Uploads the refreshed baseline + regenerated flip-ddl as an artifact; never pushes.
        type: boolean
        default: false

# Never let two runs race the same database.
concurrency:
  group: nightly-db-controls
  cancel-in-progress: false

# Nothing here writes to the repository: the capture job hands its result back as an artifact for a human
# to review and commit (ddl-governance.md §7 — a baseline is never re-captured without reading the hunks).
permissions:
  contents: read

jobs:
  live-checks:
    name: Live DB controls (14, 16, 17)
    # Every scheduled run, and every manual run that did not ask for a capture.
    if: ${{ github.event_name == 'schedule' || !inputs.capture_baseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # No `prisma generate`: none of these three need the Prisma CLIENT. Check 17 parses the .prisma
      # schema files as TEXT (scripts/table-ownership.mjs), and 14/16 talk to Postgres directly. Skipping it
      # removes a whole failure mode from a job whose job is to be trustworthy.

      - name: Fail fast if the credential is absent
        env:
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          if [ -z "$PROD_DIRECT_URL" ]; then
            echo "::error title=Nightly DB controls did not run::PROD_DIRECT_URL is not set."
            echo "This job verifies nothing without it. Failing rather than passing vacuously — see #124." >&2
            exit 1
          fi

      - name: Refuse a credential that does not require verify-full TLS
        env:
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        # Reads the URL from the environment by NAME and never prints it. libpq treats require/prefer as
        # "encrypt but trust anyone" and verify-ca skips the hostname, so only verify-full is accepted.
        run: npx tsx scripts/security/assert-verify-full.ts PROD_DIRECT_URL

      - name: Install PostgreSQL 17 client (check 16 needs pg_dump >= server)
        run: |
          # Production is PostgreSQL 17.x and pg_dump refuses to dump a server newer than itself. Ubuntu
          # runners ship an older client, so take it from PGDG.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Run checks 14, 16 and 17
        id: checks
        env:
          # The Supabase session pooler chains to this committed project CA. PGSSLROOTCERT is read by
          # libpq (pg_dump, check 16) AND by scripts/security/db-tls.ts (checks 14, 17), so one variable
          # pins the CA for all three. The URL's own sslmode=verify-full is asserted by the pre-step;
          # PGSSLMODE is belt-and-braces for a URL that somehow lacks one. Never disable verification.
          PGSSLROOTCERT: scripts/parity/supabase-root-ca.pem
          PGSSLMODE: verify-full
          # Check 14's coverage floor: exit 2 if the empirical probe covers fewer tables than this.
          RLS_MIN_PROBED: '30'
          # Non-secret UUID of a populated test tenant, stored as a repository variable.
          # A positive-control row is required because ci_readonly itself obeys RLS.
          RLS_PROBE_ORG_ID: ${{ vars.RLS_PROBE_ORG_ID }}
          # Both names: check 14 prefers DIRECT_URL, check 16's script reads DIRECT_URL, check 17 accepts
          # either. Setting both avoids a check silently falling back to something unintended.
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
          PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        run: |
          # NOT `set -e`. Every check must run even if an earlier one fails — the same contract /gate has,
          # for the same reason: one failure must not hide the state of the other two.
          set +e
          fail=0

          run_check () {
            local num="$1" name="$2"; shift 2
            echo "::group::Check $num — $name"
            "$@"
            local rc=$?
            echo "::endgroup::"
            case $rc in
              0) echo "✅ check $num ($name): PASS" | tee -a "$GITHUB_STEP_SUMMARY" ;;
              1) echo "❌ check $num ($name): **FOUND A VIOLATION** (exit 1)" | tee -a "$GITHUB_STEP_SUMMARY"
                 echo "::error title=check $num found a violation::$name reported a finding — see the log group above."
                 fail=1 ;;
              2) echo "⚠️ check $num ($name): **DID NOT RUN** (exit 2) — this is NOT a pass" | tee -a "$GITHUB_STEP_SUMMARY"
                 echo "::error title=check $num DID NOT RUN::$name could not execute. Nothing was verified. Treating as failure (#38)."
                 fail=1 ;;
              *) echo "⚠️ check $num ($name): unexpected exit $rc — treating as DID NOT RUN" | tee -a "$GITHUB_STEP_SUMMARY"
                 echo "::error title=check $num exited $rc::Unexpected exit code. Treated as did-not-run, never as a pass."
                 fail=1 ;;
            esac
          }

          echo "## Nightly DB controls" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          run_check 14 "RLS tenant isolation"   npx tsx scripts/security/verify-rls-isolation.ts
          run_check 16 "schema drift vs baseline" bash scripts/db/schema-baseline.sh check
          run_check 17 "app_tenant least privilege" npx tsx scripts/security/verify-tenant-grants.ts

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Exit 1 = found something · exit 2 = could not run. Both fail this job; only 0 is a pass._" \
            >> "$GITHUB_STEP_SUMMARY"

          exit $fail

  # ── #328: re-capture the baseline from CI ─────────────────────────────────────────────────────────────
  # A developer machine often cannot reach the direct connection at all (#328: db.<ref>.supabase.co did not
  # resolve — IPv6 only), so `capture` could not run anywhere. This job runs it with the SAME credential,
  # TLS pinning and pg_dump 17 as check 16 — which is the point: the nightly check diffs exactly what this
  # job captures. ci_readonly suffices: `pg_dump --schema-only` reads catalogs and takes ACCESS SHARE locks,
  # which SELECT covers. Check 16 PASSED as ci_readonly on 2026-09-29 (run 36614697689) against the committed
  # baseline, so a ci_readonly dump has the committed form. NB: this repository is PUBLIC — the artifact
  # holds exactly what the committed baseline already publishes (schema only, no rows), nothing more.
  #
  # Output is an ARTIFACT, never a commit (contents: read, persist-credentials: false). Apply it by hand
  # and read every hunk the object-level summary lists — see the README inside the artifact.
  capture-baseline:
    name: Re-capture schema baseline (artifact only, #328)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_baseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse any ref but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Baseline capture refused::capture runs from main only (got $GITHUB_REF). The baseline must be captured against the code that will be diffed against it."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fail fast if the credential is absent
        env:
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          if [ -z "$PROD_DIRECT_URL" ]; then
            echo "::error title=Baseline capture did not run::PROD_DIRECT_URL is not set."
            exit 1
          fi

      - name: Refuse a credential that does not require verify-full TLS
        env:
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: npx tsx scripts/security/assert-verify-full.ts PROD_DIRECT_URL

      - name: Install PostgreSQL 17 client (pg_dump >= server)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Capture the baseline, regenerate flip-ddl, re-check
        shell: bash
        env:
          PGSSLROOTCERT: scripts/parity/supabase-root-ca.pem
          PGSSLMODE: verify-full
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
          PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/schema-baseline-recapture"
          mkdir -p "$out"

          # capture exits 0 or 2 (could not run); -e + pipefail turns 2 into a failed step, never a pass.
          bash scripts/db/schema-baseline.sh capture | tee "$out/capture-summary.txt"

          # Re-capturing changes the flip-ddl source; regenerate from each file's own `-- Regenerate:` line.
          bash scripts/db/regenerate-flip-ddl.sh | tee -a "$out/capture-summary.txt"

          # Round-trip: the file just written must diff clean against a fresh dump (exit 1 = drift between
          # two dumps seconds apart, exit 2 = could not run — both fail the step).
          bash scripts/db/schema-baseline.sh check

          git diff --stat -- packages/db/baseline services/Tims.Platform/db/flip-ddl | tee "$out/diffstat.txt"
          git diff --binary -- packages/db/baseline services/Tims.Platform/db/flip-ddl > "$out/schema-baseline-recapture.patch"
          mkdir -p "$out/files/packages/db/baseline" "$out/files/services/Tims.Platform/db/flip-ddl"
          cp packages/db/baseline/prod-public-schema.sql "$out/files/packages/db/baseline/"
          cp services/Tims.Platform/db/flip-ddl/*.sql "$out/files/services/Tims.Platform/db/flip-ddl/"
          cat > "$out/README.txt" <<EOF
          Production schema baseline re-capture (#328) — run $GITHUB_RUN_ID, commit $GITHUB_SHA.

          1. READ capture-summary.txt. Every '+'/'-' object it lists is a real production change. If one is
             not explained by a reviewed change, STOP — docs/architecture/ddl-governance.md section 7.
          2. Apply on a branch cut from $GITHUB_SHA (or rebase onto it):
               git apply schema-baseline-recapture.patch
             (or copy the files/ tree over the repo root).
          3. npx vitest run tests/db   — the flip-ddl generator test must pass.
          4. Commit both the baseline and the regenerated flip-ddl files in ONE PR, with the summary in its body.
          EOF

          {
            echo "## Schema baseline re-capture"
            echo
            echo '```'
            cat "$out/capture-summary.txt"
            echo
            cat "$out/diffstat.txt"
            echo '```'
            echo
            echo "_Artifact only — nothing was committed or pushed. See README.txt in the artifact._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the refreshed baseline
        uses: actions/upload-artifact@v4
        with:
          name: schema-baseline-recapture
          path: ${{ runner.temp }}/schema-baseline-recapture
          if-no-files-found: error
          retention-days: 14

# NOT RUN HERE, deliberately:
#   scripts/db/pre-flip-scan.ts — takes table names as arguments and answers "is THIS table safe to flip".
#   There is no meaningful nightly form of that question, so folding it in (as #132's residual suggested)
#   would produce a check with nothing to assert. It stays a documented per-flip step in the runbook.
